monitor=,preferred,auto,1

exec-once = waybar # status bar
exec-once = wpaperd -d # wallpaper
exec-once = iwgtk -i # wifi applet
exec-once = trayscale --hide-window # tailscale vpn applet
exec-once = blueman-applet # bluetooth applet
exec-once = swayidle timeout 300 "hyprctl dispatcher dpms off && swaylock --color '#000000'"
# status bar & wallpaper & applet for iwctl & applet for tailscale & applet for bluetooth & input method & screensaver timeout

# Some default env vars.
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct # change to qt6ct if you have that

ecosystem {
  no_update_news = true
  no_donation_nag = true
}

input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =

  follow_mouse = 2
  mouse_refocus = 0

  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

  touchpad {
    disable_while_typing = true
    natural_scroll = no
  }
}

general {
  gaps_in = 4
  gaps_out = 8
  gaps_workspaces = 0
  border_size = 2
  # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  # col.active_border = rgba(fb4934ee) rgba(fe8019ee) 30deg
  col.active_border =  rgba(fabd2fcc) rgba(fe8019cc) rgba(fb4934cc) 45deg
  col.inactive_border = rgba(595959aa)

  resize_on_border = false
  hover_icon_on_border = true

  layout = master

  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false
}

cursor {
  inactive_timeout = 8
  no_warps = false
  warp_on_change_workspace = true
  hotspot_padding = 2
}

decoration {
  rounding = 8
  rounding_power = 2.0
  active_opacity = 0.97
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.2
  dim_special = 0.2

  shadow {
    enabled = true
    range = 20
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = false
    size = 3
    passes = 1
  }

  glow {
    enabled = false
    range = 4
    render_power = 4
    color =  rgba(fb4934ee)
  }
}

animations {
  enabled = true
  # first_launch_animation = false

  bezier = myBezier, 0.05, 0.9, 0.1, 1.00

  animation = windows, 1, 0.1, default
  animation = windowsOut, 1, 0.1, default, popin 80%
  animation = border, 1, 0.1, default
  animation = borderangle, 1, 0.1, default
  animation = fade, 1, 0.1, default
  animation = workspaces, 1, 0.1, default

  # "Smart gaps" / "No gaps when only"
  workspace = w[t1], gapsout:0, gapsin:0
  workspace = w[tg1], gapsout:0, gapsin:0
  workspace = f[1], gapsout:0, gapsin:0
  # windowrulev2 = bordersize 0, floating:0, onworkspace:w[t1]
  # windowrulev2 = rounding 0, floating:0, onworkspace:w[t1]
  # windowrulev2 = bordersize 0, floating:0, onworkspace:w[tg1]
  # windowrulev2 = rounding 0, floating:0, onworkspace:w[tg1]
  # windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
  # windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
}

master {
  new_status = 'slave'
  new_on_top = false
  # no_gaps_when_only = 1
  bezier = linear, 0, 1, 0, 1
  # bezier = linear, 0.16, 1, 0.3, 1
  # bezier = linear, 0.34, 1.1, 0.64, 1

  animation = windows, 1, 2, default, slide
  animation = windowsIn, 1, 2, default, slide
  animation = windowsOut, 1, 2, default, slide
  animation = windowsMove, 1, 4, default, slide
  animation = border, 1, 3, default
  animation = fade, 1, 6, default
  animation = workspaces, 1, 3, default
}

gestures {
  # workspace_swipe = false
}

misc {
  force_default_wallpaper = 0 # Set to 0 to disable the anime mascot wallpapers
  disable_hyprland_logo = true
  disable_splash_rendering = true

  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
  middle_click_paste = false

  disable_autoreload = true

  # vfr = true
  vrr = 0
}

# no gaps when only
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]
windowrule = rounding 0, match:float 0, match:workspace f[1]

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind=$mod,RETURN,exec, kitty --single-instance
bind=$mod SHIFT,Q,killactive,
# bind=$mod SHIFT,E,exec,hyprctl dispatch exit
bind=$mod SHIFT,R,exec,hyprctl reload
bind=$mod,F,fullscreen,
bind=$mod CONTROL,L,exec,sleep 0.5 && hyprctl dispatcher dpms off && swaylock --color 000000
bind=$mod, SPACE, togglefloating,
bind=$mod, D, exec, pkill wofi || wofi --show drun
bind=$mod, O, exec, firefox
bind=$mod SHIFT, W, exec, wpaperd  # TODO: seems to produce more daemons.

binde=, XF86MonBrightnessUp, exec, brightnessctl set 10%+
binde=, XF86MonBrightnessDown, exec, brightnessctl set 10%-

binde=, XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10% 
binde=, XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10% 
bindl=, XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle 
bindl=, XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle 

# binde=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ +10% 
# binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ -10% 
# bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle 
# bindl=, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle 

bind = $mod SHIFT,Print,exec, slurp | grim -g - - | tee "$HOME/Media/$(date --iso-8601=seconds).png" | wl-copy
# bind = $mod CONTROL,Print,exec, grim -c -o "$(hyprctl activeworkspace -j | jq -r '.monitor')" | tee "$HOME/Media/$(date --iso-8601=seconds).png" | wl-copy

# Move focus with mod + vim dirctions
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace but do not follow it
bind = $mod CONTROL, 1, movetoworkspacesilent, 1
bind = $mod CONTROL, 2, movetoworkspacesilent, 2
bind = $mod CONTROL, 3, movetoworkspacesilent, 3
bind = $mod CONTROL, 4, movetoworkspacesilent, 4
bind = $mod CONTROL, 5, movetoworkspacesilent, 5
bind = $mod CONTROL, 6, movetoworkspacesilent, 6
bind = $mod CONTROL, 7, movetoworkspacesilent, 7
bind = $mod CONTROL, 8, movetoworkspacesilent, 8
bind = $mod CONTROL, 9, movetoworkspacesilent, 9
bind = $mod CONTROL, 0, movetoworkspacesilent, 10

bind = $mod CONTROL, period, movecurrentworkspacetomonitor, +1
bind = $mod CONTROL, comma, movecurrentworkspacetomonitor, -1

bind = $mod SHIFT,H,swapwindow,l
bind = $mod SHIFT,J,swapwindow,d
bind = $mod SHIFT,K,swapwindow,u
bind = $mod SHIFT,L,swapwindow,r

# Special cases of moving workspaces
bind = $mod SHIFT,E,movetoworkspace,empty
bind = $mod SHIFT,N,movetoworkspace,empty
# bind = $mod SHIFT,R,layoutmsg,rollprev
bind = $mod SHIFT,P,movetoworkspace,previous
bind = $mod,M,layoutmsg,swapwithmaster auto
bind = $mod,R,layoutmsg,rollnext
